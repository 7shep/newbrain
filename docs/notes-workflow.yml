# Applies the Brain phone app's queued actions and refreshes phone/state.json.
# Copy to .github/workflows/brain.yml in your PRIVATE notes repo. Code: github.com/7shep/newbrain (app/phone.py).
name: brain
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *" # ~5am Toronto: refresh date-based bits (snoozes, Up next)
  workflow_dispatch:
concurrency:
  group: brain
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 7shep/newbrain
          path: .brain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh planning deadlines
        continue-on-error: true # Saved dates still work if the calendar is unavailable.
        env:
          BRAIN_CALENDAR_SOURCES: ${{ secrets.BRAIN_CALENDAR_SOURCES }}
        run: python .brain/calendar_sync.py .
      - name: Prepare voice questions
        id: voice
        run: python .brain/app/phone.py . --prepare-asks
      - name: Answer voice questions with Claude
        if: steps.voice.outputs.has_questions == 'true'
        continue-on-error: true # A voice failure must not block captures or other phone actions.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # only this step sees the key
        run: |
          pip install -q anthropic
          python .brain/app/phone.py . --answer-asks
      - run: python .brain/app/phone.py . --answers-file .brain/phone-ask-answers.json
      - name: Commit and push
        run: |
          git config user.name "brain-bot"
          git config user.email "brain-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "phone: apply queue, refresh state"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
