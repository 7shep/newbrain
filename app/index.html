<title>Brain</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,700;0,6..96,800;1,6..96,600&display=swap" rel="stylesheet">
<script>/* theme before first paint: saved choice, else the system setting */
(function(){var h=document.documentElement,t=null;try{t=localStorage.getItem("brain.theme")}catch(e){}
h.dataset.theme=t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");})();</script>

<style>
:root {
  --sans: "Schibsted Grotesk", -apple-system, "SF Pro Text", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --display: "Bodoni Moda", "Bodoni 72", Didot, Georgia, serif;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html { background: var(--bg); color-scheme: dark; }
body { margin: 0; color: var(--ink); font: 14px/1.5 var(--sans); padding: 18px clamp(16px, 2.4vw, 28px) 56px; min-height: 100vh; }
::selection { background: var(--amber); color: var(--amber-ink); }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--tile-3); border-radius: 10px; border: 2px solid var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--sky); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
svg.i { width: 15px; height: 15px; flex: none; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 12px 16px; max-width: 1360px; margin: 0 auto 16px; flex-wrap: wrap; }
.bar h1 { font-size: 26px; font-weight: 700; letter-spacing: -.025em; margin: 0; }
.bar h1 span { color: var(--muted); font-weight: 400; }
.chip { display: inline-flex; align-items: center; gap: 7px; font: 500 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
.chip.agents-chip { background: none; cursor: pointer; color: var(--dim); border-color: transparent; font: inherit; }
.chip.agents-chip:hover, .chip.agents-chip.on { color: var(--muted); border-color: var(--line); }
.chip.agents-chip.busy { color: var(--amber); border-color: rgba(255,181,71,.35); }
.chip.agents-chip .st { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
.chip.agents-chip.busy .st { animation: pulse 1.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .chip.agents-chip.busy .st { animation: none; } }
.capture-btn { margin-left: auto; display: flex; align-items: center; gap: 10px; background: var(--tile); border: 1px solid var(--line); border-radius: 12px;
  padding: 9px 10px 9px 12px; width: min(360px, 100%); color: var(--dim); text-align: left; transition: border-color .2s; }
.capture-btn:hover { border-color: var(--amber); color: var(--muted); }
kbd { font: 500 11px var(--mono); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; color: var(--muted); margin-left: auto; background: var(--bg); }

/* ---------- grid + tiles ---------- */
.grid { max-width: 1360px; margin: 0 auto; display: grid; gap: 12px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.tile { background: var(--tile); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
.tile > header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; min-height: 22px; }
.tile > header h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.tile > header .n { margin-left: auto; font: 500 12px var(--mono); color: var(--dim); }
.tile > header svg { color: var(--dim); }
.tile > header .add { margin-left: auto; border: 1px solid var(--line); background: none; border-radius: 8px; padding: 3px 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tile > header .add:hover { color: var(--amber); border-color: var(--amber); }
.tile > header .n + .add { margin-left: 8px; }
.empty { color: var(--dim); font-size: 13.5px; padding: 6px 0 2px; }

.cover { grid-column: span 8; background: var(--amber); color: var(--amber-ink); border: 0; display: flex; flex-direction: column; min-height: 320px; padding: clamp(20px, 2.6vw, 30px); position: relative; overflow: hidden; }
.cover .issue { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font: 500 12px var(--mono); color: rgba(26,18,4,.6); }
.cover .issue b { font: 800 13px var(--sans); color: var(--amber-ink); letter-spacing: .02em; white-space: nowrap; }
.cover h3 { font: 800 clamp(34px, 4.4vw, 62px)/.96 var(--display); letter-spacing: -.02em; margin: 16px 0 0; max-width: 18ch; text-wrap: balance; }
.cover h3 em { font-style: italic; font-weight: 600; }
.cover p { max-width: 58ch; margin: 14px 0 0; font-size: 15.5px; color: rgba(26,18,4,.82); }
.cover .acts { margin-top: auto; padding-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cover .acts small { margin-left: auto; font: 500 11px var(--mono); color: rgba(26,18,4,.55); }

.pill { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 8px 13px; font-weight: 600; font-size: 13px; text-decoration: none;
  border: 1px solid var(--line); background: var(--tile-2); color: var(--ink); transition: transform .25s var(--ease), background .2s, border-color .2s; white-space: nowrap; }
.pill:hover { transform: translateY(-1px); background: var(--tile-3); }
.pill:active { transform: translateY(0) scale(.97); }
.cover .pill { background: var(--amber-ink); color: var(--amber); border: 0; }
.cover .pill.ghost { background: transparent; color: var(--amber-ink); box-shadow: inset 0 0 0 1.5px rgba(26,18,4,.45); }
.pill.yes { background: var(--mint); color: var(--mint-ink); border-color: var(--mint); }
.pill.sm { padding: 5px 10px; font-size: 12px; }

.next { grid-column: span 4; }
.ev { display: grid; grid-template-columns: 54px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.ev:first-of-type { border-top: 0; padding-top: 2px; }
.ev .when { font: 500 11.5px/1.35 var(--mono); color: var(--muted); }
.ev .when b { display: block; font: 700 22px/1 var(--sans); color: var(--ink); letter-spacing: -.02em; margin-bottom: 2px; }
.ev.soon .when b { color: var(--amber); }
.ev .what { font-weight: 600; min-width: 0; }
.ev .what small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }

.nudges { grid-column: span 5; }
.nudge { background: var(--tile-2); border-radius: 14px; padding: 14px; margin-bottom: 10px; transition: opacity .45s var(--ease), transform .45s var(--ease); }
.nudge h4 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.nudge p { margin: 0; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.nudge p.full { -webkit-line-clamp: unset; }
.nudge .due { font: 500 11px var(--mono); color: var(--rose); margin-left: 6px; white-space: nowrap; }
.nudge .acts { display: flex; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
.nudge.leaving { opacity: 0; transform: translateX(24px) scale(.98); }
.won { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; padding: 4px 0; }
.won b { color: var(--mint); font-weight: 600; }

.projects { grid-column: span 7; }
.proj { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; margin: 0 -10px; border-radius: 12px; cursor: pointer; }
.proj:hover { background: var(--tile-2); }
.proj.archived { opacity: .5; }
.proj .ib.hide { opacity: 0; transition: opacity .2s, color .2s, border-color .2s; }
.proj:hover .ib.hide, .proj:focus-within .ib.hide, .proj.archived .ib.hide { opacity: 1; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); }
.dot.paused { background: var(--amber); } .dot.done { background: var(--sky); } .dot.abandoned { background: var(--dim); }
.proj b { font-weight: 600; } .proj .sum { color: var(--muted); font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.open { display: flex; gap: 4px; }
.ib { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--tile); display: grid; place-items: center; color: var(--muted); text-decoration: none; transition: color .2s, border-color .2s, transform .2s var(--ease); }
.ib:hover { border-color: var(--amber); color: var(--amber); }
.ib:active { transform: scale(.94); }
.more { background: none; border: 0; color: var(--dim); font-size: 12.5px; padding: 8px 0 0; }
.more:hover { color: var(--amber); }

/* people & me live in the side panel */
.person { display: flex; align-items: center; gap: 11px; padding: 8px 10px; margin: 0 -10px; border-radius: 12px; cursor: pointer; }
.person:hover { background: var(--tile-2); }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.person .who { min-width: 0; } .person b { font-weight: 600; }
.person .who span { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person .flag { margin-left: auto; font: 500 11px var(--mono); color: var(--rose); max-width: 38%; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-card { background: var(--tile-2); border-radius: 16px; padding: 18px; margin-bottom: 26px; cursor: pointer; }
.me-card:hover { background: var(--tile-3); }
.me-card .name { font: 800 30px/1.05 var(--display); }
.me-card .tag { color: var(--muted); margin: 6px 0 10px; }
.me-card ul { margin: 0; padding-left: 16px; font-size: 13.5px; } .me-card li::marker { color: var(--amber); }
.panel-head { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
.panel-head h2 { margin: 0 !important; }
.panel-head .add { margin-left: auto; border: 1px solid var(--line); background: none; border-radius: 8px; padding: 3px 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
.people-btn { margin-left: auto; }
/* second row: capture takes the room, the chips sit after it in one outlined style */
.bar-tools { flex-basis: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bar-tools .capture-btn { margin-left: 0; flex: 1 1 320px; width: auto; }
.bar-tools .chip.agents-chip { border-color: var(--line); }
.habits { grid-column: span 12; }
.brainstorm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.brainstorm input { flex: 1 1 280px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; outline: none; transition: border-color .2s; }
.brainstorm input:focus { border-color: var(--amber); }
.brainstorm small { color: var(--dim); font-size: 12px; flex-basis: 100%; }
.habit-scroll { max-height: 440px; overflow-y: auto; padding-right: 6px; margin-right: -6px; overscroll-behavior: contain; }
.habit-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
.habit-list .habit, .habit-list .habit:first-of-type { border-top: 1px solid var(--line); padding: 10px 0; }
.past-label { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 16px 0 4px; }
.habit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.habit:first-of-type { border-top: 0; padding-top: 0; }
.habit b { font-weight: 600; display: block; }
.habit small { display: block; color: var(--dim); font-size: 12px; }
.habit.proposed { background: rgba(255,181,71,.07); border-radius: 12px; padding: 12px; margin-bottom: 6px; border: 1px solid rgba(255,181,71,.25); }
.habit.proposed .who { color: var(--amber); }
.habit.proposed + .habit { border-top: 0; }
.habit.off b { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--dim); }
.sw { width: 38px; height: 22px; border-radius: 22px; background: var(--mint); position: relative; border: 0; flex: none; transition: background .25s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 19px; width: 16px; height: 16px; border-radius: 50%; background: var(--mint-ink); transition: transform .3s var(--ease), background .25s; }
.sw.off { background: var(--tile-3); } .sw.off::after { transform: translateX(-16px); background: var(--muted); }

/* ---------- map (graphify knowledge graph) ---------- */
.map { grid-column: span 12; padding-bottom: 14px; }
.map .stage { position: relative; height: clamp(360px, 52vh, 560px); margin: 0 -6px; border-radius: 14px; background:
  radial-gradient(ellipse at 50% 40%, rgba(255,181,71,.05), transparent 60%), var(--bg); overflow: hidden; }
.map canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.map canvas.drag { cursor: grabbing; } .map canvas.hot { cursor: pointer; }
.map .zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.map .zoom button { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: var(--tile); color: var(--muted); font: 600 15px var(--sans); }
.map .zoom button:hover { color: var(--amber); border-color: var(--amber); }
.map.full { position: fixed; inset: 0; z-index: 19; /* under the note drawer (21), so clicking a dot opens the note on top */ border-radius: 0; display: flex; flex-direction: column; }
.map.full .stage { flex: 1; height: auto; margin: 0; }
.map .hint { position: absolute; left: 12px; bottom: 12px; font: 500 11px var(--mono); color: var(--dim); pointer-events: none; }
body.map-full { overflow: hidden; }
.map .card { position: absolute; left: 12px; top: 12px; max-width: min(340px, 70%); background: var(--tile-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; pointer-events: none; opacity: 0; transform: translateY(-4px); transition: opacity .18s, transform .25s var(--ease); }
.map .card.on { opacity: 1; transform: none; }
.map .card b { display: block; font-size: 14px; } .map .card small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.map .card code { font: 500 11px var(--mono); color: var(--dim); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.map-search { margin-left: auto; width: min(260px, 38vw); background: var(--tile-2); border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; font-size: 13px; color: var(--ink); outline: none; }
.map-search:focus { border-color: var(--amber); }
.map-search + datalist + .n { margin-left: 10px; }
.legend button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted); transition: border-color .2s, color .2s, opacity .2s; }
.legend button i { width: 8px; height: 8px; border-radius: 50%; }
.legend button:hover, .legend button.on { color: var(--ink); border-color: var(--muted); }
.legend.focused button:not(.on) { opacity: .45; }

.timeline { grid-column: span 12; }
.timeline .sess b { white-space: normal; }
.day { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.day:first-of-type { border-top: 0; padding-top: 0; }
.day .d { font: 500 11.5px/1.35 var(--mono); color: var(--dim); }
.day .d b { display: block; font: 700 18px/1.1 var(--sans); color: var(--ink); }
.sess { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 8px; margin: 0 -8px; border-radius: 10px; cursor: pointer; }
.sess:hover { background: var(--tile-2); }
.sess b { font-weight: 600; font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess span { color: var(--dim); font-size: 12px; }
.tagp { font: 500 11px var(--mono); color: var(--muted); background: var(--tile-2); border-radius: 5px; padding: 1px 6px; margin-right: 4px; }

.ideas { grid-column: span 12; }
.agents { grid-column: span 12; }
.run { display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
.run:first-child { border-top: 0; }
.run .st { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); align-self: center; }
.run.running .st { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
.run.done .st { background: var(--mint); }
.run.failed .st { background: var(--rose); }
.run .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run .meta { font: 500 12px var(--mono); color: var(--dim); }
.run .rep { grid-column: 2 / -1; color: var(--muted); font-size: 13px; white-space: pre-wrap; display: none; }
.run.open .rep { display: block; }
.run.open .txt { white-space: normal; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .run.running .st { animation: none; } }
.idea-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.idea-card { background: var(--tile-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 132px; transition: opacity .4s var(--ease), transform .4s var(--ease); }
.idea-card small { font: 500 11px var(--mono); color: var(--dim); display: flex; gap: 8px; justify-content: space-between; }
.idea-card .txt { font-size: 14px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.idea-card .acts { margin-top: auto; display: flex; gap: 6px; }
.idea-card.leaving { opacity: 0; transform: scale(.96); }
.ideas-foot { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.idea { padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.idea:first-of-type { border-top: 0; padding-top: 0; }
.idea small { display: block; font: 500 11px var(--mono); color: var(--dim); }
.inbox-note { margin-top: 12px; background: var(--tile-2); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.inbox-note b { color: var(--ink); }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); z-index: 20; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(820px, 100%); background: var(--tile); border-left: 1px solid var(--line); z-index: 21;
  transform: translateX(104%); transition: transform .45s var(--ease); display: flex; flex-direction: column; }
.drawer.on { transform: none; box-shadow: -30px 0 60px -20px rgba(0,0,0,.6); }
.drawer header { display: flex; gap: 10px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.drawer header .path { font: 500 12px var(--mono); color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.drawer .body { overflow-y: auto; padding: 26px clamp(18px, 4vw, 44px) 60px; flex: 1; }
.drawer .edit { display: grid; grid-template-columns: 1fr 1fr; flex: 1; min-height: 0; }
.drawer textarea { width: 100%; height: 100%; resize: none; background: var(--bg); border: 0; border-right: 1px solid var(--line); padding: 22px; font: 13.5px/1.65 var(--mono); color: var(--ink); outline: none; }
.drawer .edit .md { overflow-y: auto; padding: 22px; }
.status-line { font-size: 12.5px; color: var(--muted); }
.status-line.err { color: var(--rose); }

.md { font-size: 15px; line-height: 1.65; }
.md h1 { font: 800 34px/1.05 var(--display); margin: 0 0 14px; letter-spacing: -.01em; }
.md h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--amber); margin: 30px 0 8px; }
.md h3 { font-size: 16px; margin: 20px 0 6px; }
.md p { margin: 8px 0; } .md ul { padding-left: 20px; margin: 6px 0; } .md li { margin: 4px 0; }
.md li.task { list-style: none; margin-left: -20px; } .md li.task input { margin-right: 8px; accent-color: var(--amber); }
.md code { font: 12.5px var(--mono); background: var(--tile-2); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; font-size: 13.5px; display: block; overflow-x: auto; margin: 10px 0; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; }
.md blockquote { margin: 10px 0; padding: 8px 14px; background: var(--tile-2); border-radius: 10px; color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.md b, .md strong { color: #fff; }
.fm { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.fm span { font: 500 11.5px var(--mono); color: var(--muted); background: var(--tile-2); border-radius: 6px; padding: 3px 8px; }
.fm span b { color: var(--dim); font-weight: 500; }

/* ---------- palette ---------- */

/* ---------- map: the graphify knowledge graph, drawn in the app's own colours ---------- */

    const N = g.nodes;

  });
  cv.addEventListener("pointerleave", () => { if (!drag && hover !== pin) { hover = pin; showCard(pin); draw(); } });
  function showCard(n) {
    card.classList.toggle("on", !!n);
    if (n) card.innerHTML = `<b>${esc(n.label)}</b><small>${esc(n.groupName)} · ${n.deg} link${n.deg === 1 ? "" : "s"}</small>${n.file ? `<code>${esc(n.file)}</code>` : ""}`;
  }
  const zoom = (f, cx = W / 2, cy = H / 2) => { touched = true; const k = Math.min(Math.max(view.k * f, .2), 6); view.x = cx - (cx - view.x) * k / view.k; view.y = cy - (cy - view.y) * k / view.k; view.k = k; draw(); };
  // Pinch (Chrome/Firefox send it as ctrl+wheel) or ⌘-scroll zooms. Full screen: plain scroll pans, like a map app.
  cv.addEventListener("wheel", e => {
    const full = tile.classList.contains("full");
    if (!(e.ctrlKey || e.metaKey || full)) return; // in the tile, plain scroll still scrolls the page
    e.preventDefault(); const r = cv.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoom(Math.exp(-e.deltaY * .01), e.clientX - r.left, e.clientY - r.top);
    else { touched = true; view.x -= e.deltaX; view.y -= e.deltaY; draw(); }
  }, { passive: false });
  // Safari sends trackpad pinch as gesture events, not wheel.
  let gScale = 1;
  cv.addEventListener("gesturestart", e => { e.preventDefault(); gScale = 1; });
  cv.addEventListener("gesturechange", e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoom(e.scale / gScale, e.clientX - r.left, e.clientY - r.top); gScale = e.scale; });
  cv.addEventListener("dblclick", e => { const r = cv.getBoundingClientRect(); zoom(e.shiftKey ? 1 / 1.8 : 1.8, e.clientX - r.left, e.clientY - r.top); });
  const setFull = on => { tile.classList.toggle("full", on); document.body.classList.toggle("map-full", on); $("mapFull").textContent = on ? "✕" : "⛶"; $("mapFull").title = on ? "Exit full screen (Esc)" : "Full screen (F)"; requestAnimationFrame(() => { size(); if (!touched) { fit(); draw(); } }); };
  $("mapFull").onclick = () => setFull(!tile.classList.contains("full"));
  addEventListener("keydown", e => {  // capture phase: runs before the global Escape handler
    if (/INPUT|TEXTAREA/.test(document.activeElement?.tagName || "") || doc || $("palette").classList.contains("on")) return; // Escape closes the note/palette first
    const full = tile.classList.contains("full");
    if (e.key === "Escape" && full) return setFull(false);
    if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !doc) return setFull(!full);
    if (!full) return;
    if (e.key === "+" || e.key === "=") zoom(1.35); else if (e.key === "-") zoom(1 / 1.35); else if (e.key === "0") { touched = false; fit(); draw(); }
  }, true);
  $("mapIn").onclick = () => zoom(1.35); $("mapOut").onclick = () => zoom(1 / 1.35); $("mapFit").onclick = () => { touched = false; fit(); draw(); };

  $("mapLegend").innerHTML = groups.slice(0, 8).map(x => `<button data-g="${esc(x.id)}"><i style="background:${x.color}"></i>${esc(x.short)} <span style="color:var(--dim)">${x.n}</span></button>`).join("");
  const setFocus = id => {
    focus = id;
    $("mapLegend").classList.toggle("focused", focus != null);
    $("mapLegend").querySelectorAll("button").forEach(x => x.classList.toggle("on", focus != null && x.dataset.g === String(focus)));
    draw();
  };
  $("mapLegend").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const id = groups.find(x => String(x.id) === b.dataset.g).id;
    setFocus(focus === id ? null : id);
  };

  // Search: the browser suggests key phrases (cluster names, then ideas by how connected they are).
  const CL = " (cluster)";
  const phrases = [...groups.map(x => x.short + CL), ...[...new Set([...g.nodes].sort((a, b) => b.deg - a.deg).map(n => n.label))]];
  $("mapPhrases").innerHTML = phrases.map(p => `<option value="${esc(p)}"></option>`).join("");
  const flyTo = n => {
    touched = true;
    const k = Math.max(view.k, 2.4);
    view.k = k; view.x = W / 2 - n.x * k; view.y = H / 2 - n.y * k;
    if (focus != null && n.group !== focus) setFocus(null);
    hover = pin = n; showCard(n); draw();
  };
  const search = () => {
    const q = $("mapSearch").value.trim(), ql = q.toLowerCase();
    if (!q) return;
    if (q.endsWith(CL)) { const c = groups.find(x => x.short + CL === q); if (c) { pin = hover = null; showCard(null); touched = false; fit(); setFocus(c.id); } return; }
    const byDeg = arr => arr.sort((a, b) => b.deg - a.deg)[0];
    const n = g.nodes.find(x => x.label.toLowerCase() === ql) || byDeg(g.nodes.filter(x => x.label.toLowerCase().startsWith(ql)))
      || byDeg(g.nodes.filter(x => x.label.toLowerCase().includes(ql))) || byDeg(g.nodes.filter(x => (x.file || "").toLowerCase().includes(ql)));
    n ? flyTo(n) : toast(`Nothing on the map matches "${q}"`);
  };
  $("mapSearch").addEventListener("change", search);
  $("mapSearch").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); search(); } else if (e.key === "Escape") { $("mapSearch").value = ""; pin = hover = null; showCard(null); setFocus(null); } });
}

/* ---------- render ---------- */

function reopenButtons(item, { big } = {}) {
  const out = [];
  if (item.resume) out.push(big
    ? `<button class="pill" data-copy="${esc(item.resume.command)}">${I.term}Resume last chat</button>`
    : `<button class="ib" title="Copy command to resume the last Claude chat" data-copy="${esc(item.resume.command)}">${I.term}</button>`);
  const folder = list(item.folders)[0];
  if (folder) out.push(big
    ? `<a class="pill ghost" href="${vsc(folder)}">${I.code}Open code</a>`
    : `<a class="ib opt" title="Open ${esc(folder)} in VS Code" href="${vsc(folder)}">${I.code}</a>`);
  const link = list(item.meta?.links).find(l => /^https?:/.test(l));
  if (link) out.push(big
    ? `<a class="pill ghost" href="${esc(link)}" target="_blank" rel="noopener">${I.ext}${esc(link.replace(/^https?:\/\/(www\.)?/, "").split("/")[0])}</a>`
    : `<a class="ib opt" title="${esc(link)}" href="${esc(link)}" target="_blank" rel="noopener">${I.ext}</a>`);

function renderAgents() {
  const runs = S.agents;

      <span class="st"></span><span class="txt">${esc(r.text)}</span><span class="meta">${esc(label[r.status] || r.status)} · ${esc((r.finished || r.queued).slice(11))}</span>

const openRuns = new Set();

$("agentChip").addEventListener("click", () => { showAgents = !showAgents; renderAgents(); if (showAgents) $("agentsTile").scrollIntoView({ behavior: "smooth", block: "nearest" }); });

/* ---------- how well Claude knows you (claude/predictions.md) ---------- */
function knowsVerdict(p) {
  if (p.n < 5) return "Too few bets to judge yet.";
  const o = p.overconfidence;
  return o > 8 ? `A bit cocky: says ${p.avg_conf}% sure, right ${p.hit_rate}% of the time.`
    : o < -8 ? `Humble: says ${p.avg_conf}% sure, but right ${p.hit_rate}% of the time.`
    : `Well calibrated: says ${p.avg_conf}% sure, right ${p.hit_rate}% of the time.`;
}
function knowsChart(p) {
  // x: stated confidence 50–100%, y: how often it was right 0–100%. On the diagonal = calibrated.
  const W = 300, H = 220, L = 34, B = 26, T = 8, R = 10;
  const x = c => L + (c - 50) / 50 * (W - L - R), y = h => T + (100 - h) / 100 * (H - T - B);
  const grid = [0, 25, 50, 75, 100].map(h => `<line x1="${L}" x2="${W - R}" y1="${y(h)}" y2="${y(h)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(h) + 4}" text-anchor="end">${h}</text>`).join("")
    + [50, 60, 70, 80, 90, 100].map(c => `<text x="${x(c)}" y="${H - 8}" text-anchor="middle">${c}</text>`).join("");
  const dots = p.buckets.map(b => `<circle cx="${x(b.conf)}" cy="${y(b.hit)}" r="${4 + Math.sqrt(b.n) * 2.2}" fill="${b.hit >= b.conf ? "var(--mint)" : "var(--rose)"}" opacity=".85"><title>${b.n} bet${b.n > 1 ? "s" : ""} at ~${b.conf}%: right ${b.hit}%</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:420px;font:500 10px var(--mono);fill:var(--dim)" role="img" aria-label="Calibration chart">
    ${grid}<line x1="${x(50)}" y1="${y(50)}" x2="${x(100)}" y2="${y(100)}" stroke="var(--muted)" stroke-dasharray="4 4"/>${dots}</svg>
    <p style="color:var(--dim);font-size:12px;margin:4px 0 0">Across: how sure Claude said it was. Up: how often it was right. On the dashed line = honest. Green above it = humble, red below = cocky.</p>`;
}
function openKnows() {
  const p = S.predictions, kindName = { recommend: "Recommended options", guess: "Guesses about you", draft: "Drafts you kept", habit: "Habit calls" };
  const kinds = Object.entries(p.kinds).map(([k, v]) => `<li>${esc(kindName[k] || k)}: ${v.hits}/${v.n} right</li>`).join("");
  const bets = p.entries.map(e => `<li>${e.hit ? "✓" : "✗"} <b>${esc(e.conf)}%</b> ${esc(e.bet)}${e.hit ? "" : ` <span style="color:var(--dim)">→ you: ${esc(e.got)}</span>`} <span style="color:var(--dim);font:500 11px var(--mono)">${esc(e.date.slice(5))} · ${esc(e.kind)}</span></li>`).join("");
  const change = p.week_change == null ? "" : ` · ${p.week_change >= 0 ? "+" : ""}${p.week_change} this week`;
  openPanel("How well Claude knows you", `<div class="md">
    <h1>${p.score}<span style="font-size:18px;color:var(--dim)"> / 100</span></h1>
    <p><b>${esc(knowsVerdict(p))}</b><br><span style="color:var(--dim)">${p.n} bets${change}. 100 = always sure and right; 0 = no better than a coin flip.</span></p>
    ${knowsChart(p)}
    <h2>By kind</h2><ul>${kinds}</ul>
    <h2>Latest bets</h2><ul style="list-style:none;padding-left:0">${bets}</ul>
    <p style="color:var(--dim);font-size:12px">From <code>claude/predictions.md</code>. Claude logs a line whenever it bets on what you'll want.</p></div>`);
}
$("knowsChip").addEventListener("click", openKnows);
function renderKnows() {
  const p = S.predictions, chip = $("knowsChip");
  chip.hidden = !p || !p.n;
  if (chip.hidden) return;
  // traffic light on the score: green 70+, yellow 40-69, red below 40 (fixed yellow: --amber is blue in light mode)
  const light = p.score >= 70 ? "var(--mint)" : p.score >= 40 ? "#f0b429" : "var(--rose)";
  chip.innerHTML = `<span class="st" style="background:${light};margin:0"></span>`;  // just the dot; the score is in the tooltip
  chip.title = chip.ariaLabel = `How well Claude knows you: ${p.score} / 100`;
}

/* ---------- usage stats (Claude Code transcripts + the notes' own size) ---------- */
const big = n => n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : Number(n).toLocaleString();
const bytes = n => n >= 1e6 ? (n / 1048576).toFixed(0) + " MB" : Math.round(n / 1024) + " KB";
function bars(days, key, color) {
  const W = 420, H = 90, max = Math.max(1, ...days.map(d => d[key])), bw = W / days.length;
  return `<svg viewBox="0 0 ${W} ${H + 16}" width="100%" style="max-width:520px;font:500 10px var(--mono);fill:var(--dim)" role="img" aria-label="${key} per day, last 30 days">
    ${days.map((d, i) => { const h = d[key] / max * H; return `<rect x="${i * bw + 1}" y="${H - h}" width="${bw - 2}" height="${Math.max(h, d[key] ? 1 : 0)}" rx="2" fill="${color}"><title>${d.date}: ${big(d[key])}</title></rect>`; }).join("")}
    <text x="0" y="${H + 13}">${days[0].date.slice(5)}</text><text x="${W}" y="${H + 13}" text-anchor="end">today</text></svg>`;
}
async function openStats() {
  let st; try { st = await api("/api/stats"); } catch (e) { return toast(e.message); }
  const t = st.tokens, all = (t.input || 0) + (t.cache_write || 0) + (t.cache_read || 0) + (t.output || 0), n = st.storage.notes;
  const cell = (v, l, sub) => `<div style="background:var(--tile-2);border-radius:12px;padding:12px 14px"><div style="font:800 26px/1.1 var(--display)">${v}</div><div style="font-weight:600;font-size:13px">${l}</div>${sub ? `<div style="color:var(--dim);font-size:12px">${sub}</div>` : ""}</div>`;
  openPanel("Stats", `<div class="md">
    <h1>Stats</h1><p style="color:var(--dim)">Every Claude Code session on this Mac since ${esc(st.since || "—")}.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0">
      ${cell(big(st.prompts), "prompts sent", `${big(st.week.prompts)} this week`)}
      ${cell(big(st.sessions), "sessions", `last ${esc((st.last || "").slice(5))}`)}
      ${cell(big(st.subagents), "subagents", `${st.subagent_sessions} with their own transcript`)}
      ${cell(big(st.tool_calls), "tool calls", "")}
      ${cell(big(all), "tokens processed", `${big(st.week.tokens)} this week`)}
      ${cell(big(t.output || 0), "tokens written by Claude", "")}
      ${cell(bytes(n.bytes), "notes", `${n.files} files · ${big(n.words)} words`)}
      ${cell(bytes(st.storage.transcripts_bytes), "transcripts", "in ~/.claude/projects")}
    </div>
    <h2>Prompts per day</h2>${bars(st.days, "prompts", "var(--amber)")}
    <h2>Tokens per day</h2>${bars(st.days, "tokens", "var(--sky)")}
    <h2>Most-used tools</h2><ul>${st.top_tools.map(([k, v]) => `<li><code>${esc(k.replace(/^mcp__claude_ai_/, "").replace(/__/g, " · "))}</code> ${v.toLocaleString()}</li>`).join("")}</ul>
    <p style="color:var(--dim);font-size:12px">Most tokens are cache reads (${big(t.cache_read || 0)}): Claude re-reading the conversation so far, billed at a fraction of new input. Subagents' own work adds ${big(Object.values(st.subagent_tokens).reduce((a, b) => a + b, 0))} more.</p></div>`);
}
$("statsChip").addEventListener("click", openStats);

const CIRCLE_COLORS = [["#3b2f24", "#ffb547"], ["#23372d", "#7ee0b0"], ["#2b3a55", "#8cc4ff"], ["#3a2626", "#ff8a7a"], ["#3a2640", "#c3a6ff"]];
const circleColor = c => { if (!c || c === "other") return ["#2a2d31", "#9a9ea4"]; let h = 0; for (const ch of c) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return CIRCLE_COLORS[h % CIRCLE_COLORS.length]; };
const initials = name => name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
function openPeople() {

    <div class="tag">${esc(m.tagline || "")}</div>
    ${S.me.exists ? `<ul>${S.me.snapshot.slice(0, 5).map(s => `<li>${inline(s)}</li>`).join("")}</ul>` : `<div class="empty">No <code>me.md</code> yet. Click to write it.</div>`}</div>`;
  const people = ps.map(p => {
    const [bg, fg] = circleColor(p.meta.circle);

      <div class="who"><b>${esc(p.meta.name || p.title)}</b><span>${esc(p.meta.relation || "")}</span></div>
      ${p.meta.follow_up ? `<span class="flag" title="${esc(p.meta.follow_up)}">${esc(p.meta.follow_up)}</span>` : ""}</div>`;
  }).join("") || `<div class="empty">No one here yet.</div>`;
  openPanel("People & me", `<h1>People &amp; me</h1>${me}<div class="panel-head"><h2>People · ${ps.length}</h2><button class="add" data-action="add-person">+ Person</button></div>${people}`);
}

let showPast = false;
function habitRow(h) {

/* ---------- markdown ---------- */
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])_([^_]+)_(?=[\s).,]|$)/g, "$1<i>$2</i>");
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, h) => /^https?:/.test(h.replace(/&amp;/g, "&"))
    ? `<a href="${h}" target="_blank" rel="noopener">${t}</a>` : `<a href="#" data-link="${h}">${t}</a>`);
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s;
}
function md(src) {
  const lines = src.replace(/\r/g, "").split("\n"); const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i]; let m;
    if (/^```/.test(l)) { const b = []; i++; while (i < lines.length && !/^```/.test(lines[i])) b.push(lines[i++]); out.push(`<pre><code>${esc(b.join("\n"))}</code></pre>`); i++; continue; }
    if ((m = l.match(/^(#{1,4}) (.+)/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^---+\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|\s*$/g, "").split("|").map(c => c.trim());
      out.push("<table>" + rows.filter(r => !/^\|[\s:|-]+\|?\s*$/.test(r)).map((r, k) => "<tr>" + cells(r).map(c => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("") + "</tr>").join("") + "</table>");
      continue;
    }
    if (/^\s*([-*]|\d+\.) /.test(l)) {
      const items = [];
      while (i < lines.length && (/^\s*([-*]|\d+\.) /.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const x = lines[i++];
        if (/^\s*([-*]|\d+\.) /.test(x)) items.push({ depth: x.match(/^\s*/)[0].length, text: x.replace(/^\s*([-*]|\d+\.) /, "") });
        else items[items.length - 1].text += " " + x.trim();
      }
      let h = "", st = [];
      for (const it of items) {
        while (st.length && it.depth < st[st.length - 1]) { h += "</li></ul>"; st.pop(); }
        if (!st.length || it.depth > st[st.length - 1]) { h += "<ul>"; st.push(it.depth); } else h += "</li>";
        const t = it.text.match(/^\[( |x|X)\] (.*)/);
        h += t ? `<li class="task"><input type="checkbox" disabled ${t[1] !== " " ? "checked" : ""}>${inline(t[2])}` : `<li>${inline(it.text)}`;
      }
      out.push(h + "</li></ul>".repeat(st.length)); continue;
    }
    if (/^> /.test(l)) { out.push(`<blockquote>${inline(l.slice(2))}</blockquote>`); i++; continue; }
    if (!l.trim()) { i++; continue; }
    const p = []; while (i < lines.length && lines[i].trim() && !/^(#|```|\||\s*[-*] |\s*\d+\. |> )/.test(lines[i])) p.push(lines[i++]);
    out.push(`<p>${inline(p.join(" "))}</p>`);
  }
  return out.join("\n");
}
function splitFm(text) {
  if (!text.startsWith("---\n")) return [{}, text];
  const end = text.indexOf("\n---", 4); if (end < 0) return [{}, text];
  const meta = {};
  text.slice(4, end).split("\n").forEach(line => { const k = line.indexOf(":"); if (k > 0 && !line.trim().startsWith("#")) meta[line.slice(0, k).trim()] = line.slice(k + 1).replace(/\s{2,}#.*$/, "").trim(); });
  return [meta, text.slice(end + 4).replace(/^\n+/, "")];
}
function renderDoc(text) {
  const [meta, body] = splitFm(text);
  const chips = Object.entries(meta).filter(([k, v]) => v && v !== "[]" && !["name", "title", "summary"].includes(k))
    .map(([k, v]) => `<span><b>${esc(k)}</b> ${esc(v.replace(/^\[|\]$/g, ""))}</span>`).join("");
  return (chips ? `<div class="fm">${chips}</div>` : "") + md(body);
}

/* ---------- drawer ---------- */

$("dClose").onclick = closeDoc; $("scrim").onclick = closeDoc;
$("openPeople").onclick = () => openPeople();

/* ---------- actions ---------- */
let undo = null;
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-copy],[data-open],[data-nact],[data-hset],[data-iact],[data-archive],[data-action],[data-link],[data-capture],[data-jump],#toggleProjects,#toggleIdeas,#togglePast,#moreSessions");
  if (!t || e.target.closest("a[href]:not([data-link])")) return;
  if (t.dataset.copy !== undefined) {
    e.stopPropagation();
    try { await navigator.clipboard.writeText(t.dataset.copy); toast("Resume command copied — paste it in Terminal"); }
    catch { prompt("Copy this into Terminal:", t.dataset.copy); }
    return;
  }
  if (t.dataset.nact) {
    e.stopPropagation();
    const card = t.closest("[data-nudge]"), id = card.dataset.nudge, action = t.dataset.nact;
    card.classList.add("leaving");
    if (action === "done") celebrate(t);
    try {
      await api("/api/nudge", { id, action, days: +t.dataset.days || undefined });
      undo = () => api("/api/nudge", { id, action: "reopen" }).then(load);
      toast(action === "done" ? pick(DONE) : action === "no" ? pick(NO) : pick(SNOOZE), true);
      setTimeout(load, 380);
    } catch (err) { card.classList.remove("leaving"); toast(err.message); }
    return;
  }
  if (t.dataset.hset) {
    e.stopPropagation();
    const row = t.closest("[data-habit]"), h = S.habits.find(x => x.id === row.dataset.habit), prev = h.status, status = t.dataset.hset;
    if (status === "on") celebrate(t, 10);
    try {
      await api("/api/habit", { id: h.id, status });
      undo = () => api("/api/habit", { id: h.id, status: prev }).then(load);
      toast(status === "on" ? (prev === "proposed" ? "Claude will start doing this next session." : "Habit back on.") : "Claude will stop doing that.", true);
      load();
    } catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.iact) {
    e.stopPropagation();
    const card = t.closest("[data-idea]"), text = card.dataset.idea, action = t.dataset.iact;
    card.classList.add("leaving");
    if (action === "done") celebrate(t);
    try {
      await api("/api/idea", { text, action });
      undo = () => api("/api/idea", { text, action: "restore" }).then(load);
      toast(action === "done" ? pick(["Idea shipped.", "Done and dusted.", "One idea, realized."]) : pick(["Dismissed.", "Let it go.", "Off the board."]), true);
      setTimeout(load, 350);
    } catch (err) { card.classList.remove("leaving"); toast(err.message); }
    return;
  }
  if (t.dataset.archive) {
    e.stopPropagation();
    const on = t.dataset.on === "1", path = t.dataset.archive;
    try {
      await api("/api/project", { path, archived: on });
      undo = () => api("/api/project", { path, archived: !on }).then(load);
      toast(on ? "Hidden. It's under “Show hidden”." : "Back on the list.", true);
      load();
    } catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.action === "add-person") { addPerson(); return; }
  if (t.id === "toggleIdeas") { showAllIdeas = !showAllIdeas; renderIdeas(); return; }
  if (t.id === "togglePast") { showPast = !showPast; renderHabits(); return; }
  if (t.dataset.capture) { openPalette(t.dataset.capture); return; }
  if (t.dataset.jump) { openPalette("note", t.dataset.jump); return; }
  if (t.id === "toggleProjects") { showAllProjects = !showAllProjects; renderProjects(); return; }
  if (t.id === "moreSessions") { sessLimit += 10; renderTimeline(); return; }
  if (t.dataset.link) { e.preventDefault(); const target = resolve(doc?.path || "", t.dataset.link); openDoc(target); return; }
  if (t.dataset.open) { openDoc(t.dataset.open); return; }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "brainForm") return;
  e.preventDefault();
  const title = $("brainTitle").value.trim(); if (!title) return $("brainTitle").focus();
  try {
    await api("/api/habit-new", { title });
    $("brainTitle").value = ""; celebrate(e.target.querySelector("button"), 14);
    toast("Proposed. Claude will shape it with you next session."); load();
  } catch (err) { toast(err.message); }
});
function resolve(base, href) {
  const parts = base.split("/").slice(0, -1);
  for (const seg of href.split("#")[0].split("/")) { if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg); }
  return parts.join("/");
}

/* ---------- palette ---------- */
let kind = "note", sel = -1, results = [];
function openPalette(k = "note", q = "") {
  kind = k; sel = q ? 0 : -1;
  document.querySelectorAll(".kind").forEach(b => b.classList.toggle("on", b.dataset.kind === kind));
  $("pInput").value = q; $("palette").classList.add("on"); $("pScrim").classList.add("on");
  $("pInput").placeholder = { note: "What's on your mind?", idea: "What if…", todo: "Something to do", person: "Who, and what about them?" }[kind];
  search(); setTimeout(() => $("pInput").focus(), 30);
}
function closePalette() { $("palette").classList.remove("on"); $("pScrim").classList.remove("on"); }
function pages() {
  if (!S) return [];
  return [
    { path: "me.md", title: "About me", kind: "me" },
    ...S.projects.map(p => ({ path: p.path, title: p.title, kind: "project" })),
    ...S.people.map(p => ({ path: p.path, title: p.meta.name || p.title, kind: "person" })),
    ...S.sessions.map(s => ({ path: s.path, title: s.title, kind: s.meta.date })),
    ...S.notes.map(n => ({ path: n.path, title: n.title, kind: "note" })),
    { path: "ideas.md", title: "Ideas", kind: "list" }, { path: "nudges.md", title: "Notes to self (all)", kind: "list" },
    { path: "claude/habits.md", title: "Claude's habits", kind: "list" }, { path: "now.md", title: "Cover story", kind: "list" },
  ];
}
function search() {
  const q = $("pInput").value.trim().toLowerCase();
  results = q ? pages().filter(p => (p.title + " " + p.path).toLowerCase().includes(q)).slice(0, 8) : [];
  if (sel >= results.length) sel = results.length - 1;
  $("pResults").innerHTML = results.map((r, k) => `<div class="res ${k === sel ? "sel" : ""}" data-k="${k}">${I.note}<b>${esc(r.title)}</b><span>${esc(r.kind)}</span></div>`).join("");
}
$("pInput").addEventListener("input", () => { sel = -1; search(); });
$("pResults").addEventListener("click", e => { const r = e.target.closest(".res"); if (r) { closePalette(); openDoc(results[+r.dataset.k].path); } });
$("kinds").addEventListener("click", e => { const b = e.target.closest(".kind"); if (b) openPalette(b.dataset.kind, $("pInput").value); });
$("pScrim").onclick = closePalette;
$("pInput").addEventListener("keydown", async e => {
  if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel + 1, results.length - 1); search(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel - 1, -1); search(); }
  else if (e.key === "Tab") { e.preventDefault(); const ks = ["note", "idea", "todo", "person"]; openPalette(ks[(ks.indexOf(kind) + (e.shiftKey ? 3 : 1)) % 4], $("pInput").value); }
  else if (e.key === "Enter") {
    e.preventDefault();
    if (sel >= 0 && results[sel]) { closePalette(); return openDoc(results[sel].path); }
    const text = $("pInput").value.trim(); if (!text) return;
    try { await api("/api/capture", { kind, text }); closePalette(); celebrate($("openPalette"), 14); toast(pick(CAPTURE)); load(); }
    catch (err) { toast(err.message); }
  }
});
$("openPalette").onclick = () => openPalette();

document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("palette").classList.contains("on") ? closePalette() : openPalette(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s" && doc && !doc.panel && !$("dEditWrap").hidden) { e.preventDefault(); saveDoc(); }
  else if (e.key === "Escape") { if ($("palette").classList.contains("on")) closePalette(); else if (doc) closeDoc(); }
  else if (e.key === "e" && doc && !doc.panel && !typing && $("dEditWrap").hidden) { e.preventDefault(); setMode(true); }
});

/* ---------- toast + celebrate ---------- */
let tt;
function toast(msg, withUndo) {
  $("toastMsg").textContent = msg; $("toastUndo").hidden = !withUndo;
  $("toast").classList.add("on"); clearTimeout(tt); tt = setTimeout(() => { $("toast").classList.remove("on"); undo = null; }, withUndo ? 4200 : 2200);
}
$("toastUndo").onclick = () => { if (undo) { undo(); undo = null; $("toast").classList.remove("on"); } };
function celebrate(el, n = 22) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ["#ffb547", "#7ee0b0", "#8cc4ff", "#ff8a7a", "#c3a6ff", "#eceae4"];
  for (let k = 0; k < n; k++) {
    const b = document.createElement("i"); b.className = "bit"; b.style.background = colors[k % colors.length];
    b.style.left = cx + "px"; b.style.top = cy + "px"; document.body.appendChild(b);
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 90;
    b.animate([
      { transform: "translate(-50%,-50%) rotate(0deg) scale(1)", opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * v}px), calc(-50% + ${Math.sin(a) * v - 40}px)) rotate(${Math.random() * 540}deg) scale(.9)`, opacity: 1, offset: .6 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * v * 1.15}px), calc(-50% + ${Math.sin(a) * v + 50}px)) rotate(${Math.random() * 720}deg) scale(.6)`, opacity: 0 },
    ], { duration: 900 + Math.random() * 400, easing: "cubic-bezier(.16,1,.3,1)" }).onfinish = () => b.remove();
  }
}

/* ---------- boot ---------- */
load().then(() => { const h = decodeURIComponent(location.hash.slice(1)); if (h === "people") openPeople(); else if (h.endsWith(".md")) openDoc(h); initMap(); });
const idle = () => !doc && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName || "");
setInterval(() => { if (!document.hidden && idle()) load(); }, 30000);
addEventListener("focus", () => { if (idle()) load(); });
